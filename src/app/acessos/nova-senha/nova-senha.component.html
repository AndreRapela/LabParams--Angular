<section class="login-page" aria-labelledby="new-password-title">
  <div class="login-wrapper">

    <div class="logo-block">
      <div class="logo-icon" aria-hidden="true">
        <i class="fa-solid fa-flask"></i>
      </div>
      <h1 class="logo-title">SYSmLab</h1>
      <p class="logo-subtitle">
        Sistema inteligente de monitoramento para laboratórios ambientais
      </p>
    </div>

    <div class="login-card">
      <header class="card-header">
        <h2 id="new-password-title" class="card-title">Nova senha</h2>
        <p class="card-description">
          Informe sua nova senha abaixo.
        </p>
      </header>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">

        <!-- NOVA SENHA -->
        <div class="field">
          <label for="new-password">Nova senha</label>
          <input
            id="new-password"
            type="password"
            formControlName="senha"
            autocomplete="new-password"
            placeholder="Digite sua nova senha"
            [class.invalid]="form.get('senha')?.touched && form.get('senha')?.invalid"
          />
          <div class="field-error" *ngIf="form.get('senha')?.touched && form.get('senha')?.hasError('required')">
            Informe a nova senha.
          </div>
          <div class="field-error" *ngIf="form.get('senha')?.touched && form.get('senha')?.hasError('minlength')">
            A senha deve ter no mínimo 6 caracteres.
          </div>
        </div>

        <!-- CONFIRMAR NOVA SENHA -->
        <div class="field">
          <label for="confirm-new-password">Confirmar nova senha</label>
          <input
            id="confirm-new-password"
            type="password"
            formControlName="confirmarSenha"
            autocomplete="new-password"
            placeholder="Confirme sua nova senha"
            [class.invalid]="form.hasError('senhasDiferentes') && form.get('confirmarSenha')?.touched"
          />
          <div class="field-error" *ngIf="form.get('confirmarSenha')?.touched && form.get('confirmarSenha')?.hasError('required')">
            Confirme sua nova senha.
          </div>
          <div class="field-error" *ngIf="form.hasError('senhasDiferentes') && form.get('confirmarSenha')?.touched">
            As senhas não conferem.
          </div>
        </div>

        <button
          class="submit-button"
          type="submit"
          [disabled]="loading || form.invalid"
        >
          {{ loading ? 'Salvando...' : 'Atualizar Senha' }}
        </button>

      </form>

      <p class="feedback success" *ngIf="successMessage" role="status">{{ successMessage }}</p>
      <p class="feedback error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>
    </div>

  </div>
</section>
